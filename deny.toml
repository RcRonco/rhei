[graph]
all-features = true

[advisories]
ignore = [
    # Transitive dependencies we can't control (no safe upgrade available)
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dep from foyer/timely, considered complete by maintainers" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive dep from foyer/timely" },
    # quick-xml reaches us only through object_store's S3 XML response parsing.
    # The fix is quick-xml >=0.41, but object_store 0.12.5 requires ^0.38, and we
    # cannot move past object_store 0.12 while slatedb 0.11.2 links against it —
    # the ObjectStore trait objects we hand to SlateDbBackend::open would no
    # longer typecheck. The advisory is a memory-exhaustion DoS on *untrusted*
    # XML; the XML we parse comes from the operator's own configured S3
    # endpoint, which is already trusted infrastructure in any deployment.
    # Revisit when slatedb bumps object_store.
    { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41 via object_store/slatedb; no upgrade path, input is the trusted S3 endpoint" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
