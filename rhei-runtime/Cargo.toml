[package]
name = "rhei-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bincode.workspace = true
flume.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
timely.workspace = true
tokio.workspace = true
rhei-core = { path = "../rhei-core" }
tower-http = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
hex = "0.4"
regex = "1"
urlencoding = "2"
seahash = "4"
bumpalo.workspace = true
arrow.workspace = true
arrow-schema.workspace = true
arrow-array.workspace = true
datafusion.workspace = true
datafusion-expr.workspace = true
datafusion-physical-expr.workspace = true
core_affinity = "0.8"
# rdkafka is an optional dep activated by the `kafka` feature so that
# `cargo test --workspace` (without --features kafka) doesn't require
# libcurl-dev / cmake to build librdkafka.
rdkafka = { workspace = true, optional = true }
object_store = { workspace = true, features = ["aws"], optional = true }
# Optional allocators used ONLY to select the global allocator in the
# `allocator` benchmark (benches/allocator.rs). Off by default — rhei never
# imposes an allocator; embedders choose their own. See ADR/memory-allocator.md.
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

[features]
kafka = ["rhei-core/kafka", "dep:rdkafka"]
remote-state = ["dep:object_store"]
# Pick the global allocator for `cargo bench --bench allocator` (mutually
# exclusive). With neither set, the platform default (glibc) is used.
bench-mimalloc = ["dep:mimalloc"]
bench-jemalloc = ["dep:tikv-jemallocator"]

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
rhei-macros = { path = "../rhei-macros" }
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
proptest.workspace = true
rstest = "0.26.1"
criterion.workspace = true

[[bench]]
name = "pipeline_e2e"
harness = false

[[bench]]
name = "exchange"
harness = false

[[bench]]
name = "allocator"
harness = false
